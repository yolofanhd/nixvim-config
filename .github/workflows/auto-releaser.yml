name: Sync stable branch

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Open sync pull request
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --base stable --head main --state open --json number --jq length)"
          if [[ "$existing" -gt 0 ]]; then
            echo "A main-to-stable pull request is already open."
            exit 0
          fi

          gh pr create \
            --base stable \
            --head main \
            --title "chore: sync main into stable" \
            --body "Automated synchronization of the main branch into stable."
