name: Conventional pull request title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_.\/-]+\))?(!)?:[[:space:]].+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title does not follow Conventional Commits:"
            echo "$PR_TITLE"
            exit 1
          fi
